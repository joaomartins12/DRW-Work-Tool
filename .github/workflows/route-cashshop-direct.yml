name: Route CashShop Direct

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CashShop direct route
        shell: python
        run: |
          from pathlib import Path
          path = Path('DRW Work Tool/Form1.Editor.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''        private void OpenEntityEditor(string entity)\n        {\n            if (!editorMode)\n                return;\n\n            TabPage? existing = editorTabs.TabPages'''
          new = '''        private void OpenEntityEditor(string entity)\n        {\n            if (!editorMode)\n                return;\n\n            // CashShop is a multi-XML visual editor. Opening the entity itself\n            // must go directly to the storefront-style workspace instead of\n            // exposing the raw XML file list first.\n            if (entity.Equals(\n                    "CashShop",\n                    StringComparison.OrdinalIgnoreCase))\n            {\n                _ = OpenCashShopVisualEditorAsync();\n                return;\n            }\n\n            TabPage? existing = editorTabs.TabPages'''
          if old not in text:
              raise SystemExit('OpenEntityEditor insertion point not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DRW Work Tool/Form1.Editor.cs"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Open CashShop visual editor directly"
            git push origin master
          fi
