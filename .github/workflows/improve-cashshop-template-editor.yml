          # ------------------------------------------------------------------
          # Item picker with ItemList icon preview.
          # ------------------------------------------------------------------
          picker_start = text.index('        private CashShopItemReference? OpenCashShopItemPicker(CashShopService service)')
          picker_end = text.index('        private static void DisposeCashShopCardImages(', picker_start)
          picker_new = r'''        private CashShopItemReference? OpenCashShopItemPicker(CashShopService service)
        {
            using var dialog = new Form
            {
                Text = "Select Item from ItemList.xml",
                Size = new Size(860, 610),
                StartPosition = FormStartPosition.CenterParent,
                BackColor = CEditor,
                ForeColor = CText,
                FormBorderStyle = FormBorderStyle.FixedDialog,
                MinimizeBox = false,
                MaximizeBox = false
            };
            var search = new TextBox
            {
                Location = new Point(14, 14),
                Size = new Size(814, 28),
                PlaceholderText = "Search Item ID, name or description...",
                BackColor = Color.FromArgb(10, 10, 10),
                ForeColor = CText,
                BorderStyle = BorderStyle.FixedSingle
            };
            var list = new ListBox
            {
                Location = new Point(14, 52),
                Size = new Size(590, 472),
                BackColor = Color.FromArgb(18, 18, 18),
                ForeColor = CText,
                BorderStyle = BorderStyle.FixedSingle,
                Font = new Font("Segoe UI", 9F)
            };
            var preview = new PictureBox
            {
                Location = new Point(632, 72),
                Size = new Size(144, 144),
                BackColor = Color.FromArgb(8, 8, 12),
                SizeMode = PictureBoxSizeMode.Zoom
            };
            var details = new Label
            {
                Location = new Point(618, 228),
                Size = new Size(204, 190),
                ForeColor = CText,
                AutoEllipsis = true,
                TextAlign = ContentAlignment.TopCenter
            };
            var select = CreateEditorActionButton("SELECT");
            select.Location = new Point(686, 492);
            select.Size = new Size(136, 32);
            dialog.Controls.AddRange(new Control[] { search, list, preview, details, select });

            List<CashShopItemReference> current = new();

            void RefreshPreview()
            {
                Image? old = preview.Image;
                preview.Image = null;
                details.Text = string.Empty;
                int index = list.SelectedIndex;
                if (index >= 0 && index < current.Count)
                {
                    CashShopItemReference item = current[index];
                    preview.Image = ImageDatabasePreview.TryLoadInterfaceIcon(item.IconId, "Item");
                    details.Text = $"Item ID {item.Id}\r\n\r\n{item.Name}\r\n\r\nIcon ID {item.IconId}\r\n\r\n{item.Description}";
                }
                if (!ReferenceEquals(old, preview.Image)) old?.Dispose();
            }

            void Refresh()
            {
                current = service.SearchItems(search.Text).ToList();
                list.BeginUpdate();
                list.Items.Clear();
                foreach (CashShopItemReference item in current)
                    list.Items.Add($"{item.Id} — {item.Name} — Item Icon {item.IconId}");
                list.EndUpdate();
                if (list.Items.Count > 0) list.SelectedIndex = 0;
                else RefreshPreview();
            }

            search.TextChanged += (_, _) => Refresh();
            list.SelectedIndexChanged += (_, _) => RefreshPreview();
            select.Click += (_, _) => { if (list.SelectedIndex >= 0) dialog.DialogResult = DialogResult.OK; };
            list.DoubleClick += (_, _) => { if (list.SelectedIndex >= 0) dialog.DialogResult = DialogResult.OK; };
            Refresh();

            DialogResult result = dialog.ShowDialog(this);
            Image? finalImage = preview.Image;
            preview.Image = null;
            finalImage?.Dispose();

            return result == DialogResult.OK && list.SelectedIndex >= 0 && list.SelectedIndex < current.Count
                ? current[list.SelectedIndex]
                : null;
        }

