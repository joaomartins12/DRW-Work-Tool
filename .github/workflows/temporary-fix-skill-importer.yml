name: Temporary Skill Importer Mapping Fix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-skill-importer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct Skill.xml database mappings
        shell: python
        run: |
          from pathlib import Path

          path = Path("DRW Work Tool/Database/DigimonCoreDatabaseImportService.cs")
          text = path.read_text(encoding="utf-8")

          old_value = '''                int value =
                    ReadInt(
                        applies[0],
                        "s_nB",
                        $"Skill {skillId} Apply 1");
'''
          new_value = '''                // Asset.SkillInfo.Value comes from the skill's normal damage/value
                // field, not from the first IncreaseApply parameter. This matches
                // the existing server database layout (for example 7700511 has
                // Value=0 while Apply1 s_nB=18103).
                int value =
                    ReadIntLikeDecimal(
                        node,
                        "s_fAttRange_NorDmg",
                        $"Skill {skillId}");
'''

          if old_value not in text:
              raise SystemExit("Expected SkillInfo.Value mapping block was not found.")
          text = text.replace(old_value, new_value, 1)

          old_comment = '''                        // SkillInfo.Value is the principal/first apply B value.
                        Value = value,
'''
          new_comment = '''                        // SkillInfo.Value = s_fAttRange_NorDmg.
                        Value = value,
'''
          if old_comment not in text:
              raise SystemExit("Expected SkillInfo.Value comment was not found.")
          text = text.replace(old_comment, new_comment, 1)

          old_conditions = '''                        FirstConditionCode =
                            ReadInt(
                                applies[0],
                                "s_nBuffCode",
                                $"Skill {skillId} Apply 1"),
                        SecondConditionCode =
                            ReadInt(
                                applies[1],
                                "s_nBuffCode",
                                $"Skill {skillId} Apply 2"),
                        ThirdConditionCode =
                            ReadInt(
                                applies[2],
                                "s_nBuffCode",
                                $"Skill {skillId} Apply 3"),
'''
          new_conditions = '''                        // The server DB stores each IncreaseApply s_nB as the
                        // corresponding condition code. Do NOT substitute s_nBuffCode
                        // here: e.g. 7700511 maps to 18103 / 10 / 0, exactly the
                        // three s_nB values from Apply1 / Apply2 / Apply3.
                        FirstConditionCode =
                            ReadInt(
                                applies[0],
                                "s_nB",
                                $"Skill {skillId} Apply 1"),
                        SecondConditionCode =
                            ReadInt(
                                applies[1],
                                "s_nB",
                                $"Skill {skillId} Apply 2"),
                        ThirdConditionCode =
                            ReadInt(
                                applies[2],
                                "s_nB",
                                $"Skill {skillId} Apply 3"),
'''
          if old_conditions not in text:
              raise SystemExit("Expected condition-code mapping block was not found.")
          text = text.replace(old_conditions, new_conditions, 1)

          old_log = '''            log(
                "SkillInfo mapping: MemoryChips=s_nReq_Item (SQL tinyint). " +
                "s_nMemorySkill não é gravado em MemoryChips; no Skill.xml atual contém valores como 1700/2200.");
'''
          new_log = '''            log(
                "SkillInfo effect mapping validado: Value=s_fAttRange_NorDmg; " +
                "First/Second/ThirdConditionCode=s_nB de IncreaseApply 1/2/3. " +
                "Isto preserva os parâmetros usados por damage, buffs, velocidade e outros efeitos condicionais.");

            log(
                "SkillInfo mapping: MemoryChips=s_nReq_Item (SQL tinyint). " +
                "s_nMemorySkill não é gravado em MemoryChips; no Skill.xml atual contém valores como 1700/2200.");
'''
          if old_log not in text:
              raise SystemExit("Expected SkillInfo log block was not found.")
          text = text.replace(old_log, new_log, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit corrected importer and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DRW Work Tool/Database/DigimonCoreDatabaseImportService.cs"
          git rm .github/workflows/temporary-fix-skill-importer.yml
          git commit -m "Fix Skill.xml database effect mappings"
          git push origin master
