name: Temporary Hook Skill DB Diagnostic

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch UI hook
        shell: python
        run: |
          from pathlib import Path
          p=Path('DRW Work Tool/Form1.Database.cs')
          s=p.read_text(encoding='utf-8')
          old='''            importHost.Controls.Add(\n                button);\n\n            header.Controls.Add(\n                importHost);\n'''
          new='''            if (isDigimonCore)\n            {\n                importHost.Width = 390;\n                importHost.Padding = new Padding(10, 18, 18, 18);\n\n                button.Dock = DockStyle.Right;\n                button.Width = 190;\n\n                var compareButton =\n                    CreateEditorActionButton(\n                        "COMPARE DB");\n\n                compareButton.Name =\n                    "btnCompareSkillDatabase";\n\n                compareButton.Dock =\n                    DockStyle.Left;\n\n                compareButton.Width =\n                    150;\n\n                compareButton.Font =\n                    new Font(\n                        "Segoe UI Semibold",\n                        8.5F,\n                        FontStyle.Bold);\n\n                compareButton.FlatAppearance.BorderColor =\n                    Color.FromArgb(\n                        85,\n                        120,\n                        155);\n\n                editorToolTip.SetToolTip(\n                    compareButton,\n                    "READ-ONLY: compara Skill.xml + Digimon_List.xml com SkillInfo, SkillCode, SkillCodeApply e DigimonSkill da database atual. Não altera nenhuma tabela.");\n\n                compareButton.Click +=\n                    async (_, _) =>\n                        await OpenSkillDatabaseDiagnosticTabAndRunAsync();\n\n                importHost.Controls.Add(\n                    compareButton);\n            }\n\n            importHost.Controls.Add(\n                button);\n\n            header.Controls.Add(\n                importHost);\n'''
          if old not in s:
              raise SystemExit('hook target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DRW Work Tool/Form1.Database.cs"
          git rm .github/workflows/temporary-hook-skill-diagnostic.yml
          git commit -m "Add read-only Skill database compare button"
          git push origin master
