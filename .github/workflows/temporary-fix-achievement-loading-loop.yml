name: Fix Achievement Loading Loop

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Achievement loading state
        shell: python
        run: |
          from pathlib import Path

          editor = Path("DRW Work Tool/Form1.AchievementEditor.cs")
          text = editor.read_text(encoding="utf-8")

          marker = '''        private sealed class AchievementBrowseState
        {'''
          loading_state = '''        private sealed class AchievementLoadingState
        {
            public required string FilePath { get; init; }
        }

'''
          if "private sealed class AchievementLoadingState" not in text:
              if marker not in text:
                  raise SystemExit("AchievementBrowseState marker not found")
              text = text.replace(marker, loading_state + marker, 1)

          old = '''            var page = CreateDarkTab("Achieve.xml");
            page.Name = full;
            page.Controls.Add(new EditorLoadingView('''
          new = '''            var page = CreateDarkTab("Achieve.xml");
            page.Name = full;
            page.Tag = new AchievementLoadingState { FilePath = full };
            page.Controls.Add(new EditorLoadingView('''
          if new not in text:
              if old not in text:
                  raise SystemExit("OpenAchievementBrowser loading marker not found")
              text = text.replace(old, new, 1)

          # Make the catch robust if the tab was closed while loading.
          old_catch = '''            catch (Exception ex)
            {
                page.Controls.Clear();
                page.Controls.Add(CreateInfoLabel("Achieve.xml could not be loaded.\\r\\n\\r\\n" + ex.Message));
            }'''
          new_catch = '''            catch (Exception ex)
            {
                if (page.IsDisposed)
                    return;

                page.Controls.Clear();
                page.Controls.Add(CreateInfoLabel("Achieve.xml could not be loaded.\\r\\n\\r\\n" + ex.Message));
                AppLogger.ErrorDetailed(
                    "Achievement Editor",
                    ex.Message,
                    "Verify XML\\\\Achieve\\\\Achieve.xml, XML\\\\Quest\\\\Quest.xml, XML\\\\Buff\\\\Buff.xml and ImgDatabase mappings.");
            }'''
          if old_catch in text:
              text = text.replace(old_catch, new_catch, 1)

          editor.write_text(text, encoding="utf-8")

          integration = Path("DRW Work Tool/Form1.AchievementIntegration.cs")
          itext = integration.read_text(encoding="utf-8")

          old_guard = '''            if (selected.Tag is AchievementBrowseState)
                return;
'''
          new_guard = '''            if (selected.Tag is AchievementBrowseState ||
                selected.Tag is AchievementLoadingState ||
                selected.Tag is AchievementEditState)
            {
                return;
            }
'''
          if new_guard not in itext:
              if old_guard not in itext:
                  raise SystemExit("Achievement integration state guard not found")
              itext = itext.replace(old_guard, new_guard, 1)

          integration.write_text(itext, encoding="utf-8")

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DRW Work Tool/Form1.AchievementEditor.cs" "DRW Work Tool/Form1.AchievementIntegration.cs"
          git rm .github/workflows/temporary-fix-achievement-loading-loop.yml
          git commit -m "Fix Achievement editor loading redirect loop"
          git push origin master
