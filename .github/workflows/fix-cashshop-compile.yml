name: Fix CashShop Compile

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix CS0136 in CashShop editor
        shell: python
        run: |
          from pathlib import Path
          path = Path('DRW Work Tool/Form1.CashShopEditor.cs')
          text = path.read_text(encoding='utf-8-sig')
          old = '''            var item = new Label { Text = itemText, ForeColor = CMuted, Location = new Point(12, 126), Size = new Size(202, 20), AutoEllipsis = true };'''
          new = '''            var itemLabel = new Label { Text = itemText, ForeColor = CMuted, Location = new Point(12, 126), Size = new Size(202, 20), AutoEllipsis = true };'''
          if old not in text:
              raise SystemExit('Target item label declaration not found')
          text = text.replace(old, new, 1)
          old2 = '''            card.Controls.AddRange(new Control[] { icon, badge, status, name, item, price, edit, clone });'''
          new2 = '''            card.Controls.AddRange(new Control[] { icon, badge, status, name, itemLabel, price, edit, clone });'''
          if old2 not in text:
              raise SystemExit('Target item label control reference not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DRW Work Tool/Form1.CashShopEditor.cs"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix CashShop editor local variable collision"
            git push origin master
          fi
