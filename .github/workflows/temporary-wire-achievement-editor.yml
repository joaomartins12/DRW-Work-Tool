name: Wire Achievement Editor

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch editor routing and database button
        shell: python
        run: |
          from pathlib import Path

          editor = Path("DRW Work Tool/Form1.Editor.cs")
          text = editor.read_text(encoding="utf-8")
          marker = '''            if (xmlFileName.Equals(
                    "Buff.xml",
                    StringComparison.OrdinalIgnoreCase))
            {'''
          route = '''            if (xmlFileName.Equals(
                    "Achieve.xml",
                    StringComparison.OrdinalIgnoreCase))
            {
                if (existing != null)
                {
                    string stateType = existing.Tag?.GetType().Name ?? string.Empty;
                    if (stateType.Contains("AchievementBrowseState", StringComparison.Ordinal))
                    {
                        editorTabs.SelectedTab = existing;
                        return;
                    }

                    editorTabs.TabPages.Remove(existing);
                    existing.Dispose();
                }

                OpenAchievementBrowser(xmlPath);
                return;
            }

'''
          if route not in text:
              if marker not in text:
                  raise SystemExit("Buff route marker not found in Form1.Editor.cs")
              text = text.replace(marker, route + marker, 1)
          editor.write_text(text, encoding="utf-8")

          database = Path("DRW Work Tool/Form1.Database.cs")
          db = database.read_text(encoding="utf-8")

          buff_decl = '''            bool isBuff =
                entity.Equals(
                    "Buff",
                    StringComparison.OrdinalIgnoreCase) ||
                folderName.Equals(
                    "Buff",
                    StringComparison.OrdinalIgnoreCase);
'''
          achieve_decl = buff_decl + '''
            bool isAchievement =
                entity.Equals(
                    "Achieve",
                    StringComparison.OrdinalIgnoreCase) ||
                folderName.Equals(
                    "Achieve",
                    StringComparison.OrdinalIgnoreCase);
'''
          if "bool isAchievement" not in db:
              if buff_decl not in db:
                  raise SystemExit("isBuff declaration marker not found")
              db = db.replace(buff_decl, achieve_decl, 1)

          old_guard = '''                !isMonsterCore &&
                !isBuff)
'''
          new_guard = '''                !isMonsterCore &&
                !isBuff &&
                !isAchievement)
'''
          if new_guard not in db:
              if old_guard not in db:
                  raise SystemExit("supported entity guard marker not found")
              db = db.replace(old_guard, new_guard, 1)

          old_name = '''                        : isBuff
                            ? "btnImportBuffToDatabase"
                            : isNpc
'''
          new_name = '''                        : isBuff
                            ? "btnImportBuffToDatabase"
                            : isAchievement
                                ? "btnImportAchievementToDatabase"
                            : isNpc
'''
          if "btnImportAchievementToDatabase" not in db:
              if old_name not in db:
                  raise SystemExit("button name marker not found")
              db = db.replace(old_name, new_name, 1)

          buff_branch = '''            else if (isBuff)
            {
                editorToolTip.SetToolTip(
                    button,
                    "Importa Buff.xml para Asset.Buff. " +
                    "O XML é validado completamente antes de qualquer DELETE. " +
                    "A operação usa uma única transação SQL e executa ROLLBACK em caso de erro.");

                button.Click +=
                    async (_, _) =>
                        await OpenBuffDatabaseImportTabAndRunAsync(
                            folder);
            }
'''
          achievement_branch = buff_branch + '''            else if (isAchievement)
            {
                editorToolTip.SetToolTip(
                    button,
                    "Importa Achieve.xml para Asset.Achievement. " +
                    "QuestId=s_nQuestID, BuffId=s_nBuffCode e Type=0 conforme a database funcional fornecida. " +
                    "A operação usa uma única transação SQL com ROLLBACK em caso de erro.");

                button.Click +=
                    async (_, _) =>
                        await OpenAchievementDatabaseImportTabAndRunAsync(
                            folder);
            }
'''
          if "OpenAchievementDatabaseImportTabAndRunAsync" not in db:
              if buff_branch not in db:
                  raise SystemExit("Buff import branch marker not found")
              db = db.replace(buff_branch, achievement_branch, 1)

          database.write_text(db, encoding="utf-8")

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "DRW Work Tool/Form1.Editor.cs" "DRW Work Tool/Form1.Database.cs"
          git rm .github/workflows/temporary-wire-achievement-editor.yml
          git commit -m "Wire Achievement editor and database import"
          git push origin master
